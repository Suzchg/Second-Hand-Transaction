name: CD

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123000       # 改为与 backend/src/main/resources
          MYSQL_DATABASE: secondhand       # 改为与 application.yml 中一致
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: 单元测试与真实 MySQL 集成测试
        run: mvn --batch-mode --no-transfer-progress verify

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  prepare:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    outputs:
      image-root: ${{ steps.names.outputs.image-root }}
    steps:
      - id: names
        name: Normalize GHCR image path
        shell: bash
        run: echo "image-root=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: backend
            context: backend
          - image: frontend
            context: frontend
          - image: mysql
            context: db
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ needs.prepare.outputs.image-root }}/${{ matrix.image }}:${{ github.sha }}
            ${{ needs.prepare.outputs.image-root }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to Kubernetes
    needs: [prepare, publish]
    runs-on: [self-hosted, linux, x64, secondhand]
    environment: production
    env:
      KUBECONFIG: /opt/actions-runner/.kube/config
    steps:
      - uses: actions/checkout@v6
      - name: Verify Kubernetes access
        run: kubectl cluster-info
      - name: Create namespace and runtime secrets
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          kubectl create namespace secondhand --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n secondhand create secret generic secondhand-secrets \
            --from-literal=mysql-root-password="$MYSQL_ROOT_PASSWORD" \
            --from-literal=mysql-password="$MYSQL_PASSWORD" \
            --from-literal=jwt-secret="$JWT_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n secondhand create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USERNAME" \
            --docker-password="$GHCR_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: 部署清单并等待滚动更新
        env:
          IMAGE_ROOT: ${{ needs.prepare.outputs.image-root }}
          IMAGE_TAG: ${{ github.sha }}
        run: bash scripts/deploy.sh
      - name: 端到端健康检查
        run: bash scripts/health-check.sh
