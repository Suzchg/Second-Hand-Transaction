spring:
  # 数据源由 MySqlTestSupport 提供，使用可自动清理的临时 MySQL 容器。
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

app:
  security:
    jwt:
      secret: e2e-test-secret-key-do-not-use-in-production
      access-token-expiration-minutes: 60

logistics:
  kuaidi100:
    enabled: false
