# ==========================================
# 1. 数据库部署 (MySQL)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: secondhand-mysql:v1.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "3401248245whzX" 
        - name: MYSQL_DATABASE
          value: "secondhand" 
        ports:
        - containerPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: mysql 
spec:
  selector:
    app: mysql
  ports:
  - port: 3306

---
# ==========================================
# 2. 后端部署 (Spring Boot)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: secondhand-backend:v1.0
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://mysql:3306/secondhand?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true"
        - name: SPRING_DATASOURCE_USERNAME
          value: "root"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "3401248245whzX" 
        ports:
        - containerPort: 8088
        volumeMounts:
        - name: uploads-volume
          mountPath: /root/.secondhand/uploads
      volumes:
      - name: uploads-volume
        persistentVolumeClaim:
          claimName: uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
  - port: 8088

---
# ==========================================
# 3. 前端 Nginx 配置 (ConfigMap) [⭐️新增部分]
# ==========================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
data:
  default.conf: |
    server {
        listen       80;
        server_name  localhost;

        # 解决前端 Vue/React History 模式刷新 404 的问题
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # 解决前端调用后端接口的代理问题 (拦截 /api 并转发给后端)
        location /api/ {
            proxy_pass http://backend:8088/api/; 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

---
# ==========================================
# 4. 前端部署 (Vue/Vite + Nginx) [⭐️修改了挂载部分]
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: secondhand-frontend:v1.0
        ports:
        - containerPort: 80
        # 将上方 ConfigMap 的 default.conf 挂载到容器内覆盖默认配置
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
      volumes:
      - name: nginx-conf
        configMap:
          name: frontend-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort 
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080

---
# ==========================================
# 4. 存储卷部署 (持久化图片存放)
# ==========================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads-pvc
spec:
  accessModes:
    - ReadWriteOnce # 允许被一个节点挂载为读写模式
  resources:
    requests:
      storage: 1Gi # 申请 1GB 的存储空间用来存图片，足够测试用了